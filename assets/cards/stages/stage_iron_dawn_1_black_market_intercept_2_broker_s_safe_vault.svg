<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600px" height="400px">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Light Beams -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Hazard Stripes -->
    <pattern id="hazardStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#eab308" stroke-width="10" />
      <line x1="10" y1="0" x2="10" y2="20" stroke="#1e293b" stroke-width="10" />
    </pattern>

    <!-- Core Plasma Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2994A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F2994A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky / Background Canvas -->
  <rect x="0" y="0" width="600" height="400" fill="url(#skyGrad)"/>

  <!-- Perspective Floor Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    
      <line x1="0" y1="400" x2="240" y2="180"/>
    
      <line x1="60" y1="400" x2="252" y2="180"/>
    
      <line x1="120" y1="400" x2="264" y2="180"/>
    
      <line x1="180" y1="400" x2="276" y2="180"/>
    
      <line x1="240" y1="400" x2="288" y2="180"/>
    
      <line x1="300" y1="400" x2="300" y2="180"/>
    
      <line x1="360" y1="400" x2="312" y2="180"/>
    
      <line x1="420" y1="400" x2="324" y2="180"/>
    
      <line x1="480" y1="400" x2="336" y2="180"/>
    
      <line x1="540" y1="400" x2="348" y2="180"/>
    
      <line x1="600" y1="400" x2="360" y2="180"/>
    
    
      <line x1="0" y1="200" x2="600" y2="200"/>
    
      <line x1="0" y1="240" x2="600" y2="240"/>
    
      <line x1="0" y1="280" x2="600" y2="280"/>
    
      <line x1="0" y1="320" x2="600" y2="320"/>
    
      <line x1="0" y1="360" x2="600" y2="360"/>
    
      <line x1="0" y1="395" x2="600" y2="395"/>
    
  </g>

  <!-- Thematic Encounter Architecture -->
  
      <!-- Mainframe Server Racks -->
      <rect x="120" y="150" width="100" height="230" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
      <rect x="380" y="150" width="100" height="230" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
      
        <line x1="130" y1="170" x2="210" y2="170" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="170" x2="470" y2="170" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="170" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="170" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="200" x2="210" y2="200" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="200" x2="470" y2="200" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="200" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="200" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="230" x2="210" y2="230" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="230" x2="470" y2="230" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="230" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="230" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="260" x2="210" y2="260" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="260" x2="470" y2="260" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="260" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="260" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="290" x2="210" y2="290" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="290" x2="470" y2="290" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="290" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="290" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="320" x2="210" y2="320" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="320" x2="470" y2="320" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="320" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="320" r="2" fill="#f43f5e"/>
      
        <line x1="130" y1="350" x2="210" y2="350" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <line x1="390" y1="350" x2="470" y2="350" stroke="#F2994A" stroke-width="1.5" opacity="0.7"/>
        <circle cx="135" cy="350" r="2" fill="#38bdf8"/>
        <circle cx="205" cy="350" r="2" fill="#f43f5e"/>
      
      <!-- Central Hologram Terminal -->
      <polygon points="300,160 360,280 240,280" fill="none" stroke="#F2994A" stroke-width="2" opacity="0.6"/>
      <circle cx="300" cy="220" r="35" fill="none" stroke="#F2994A" stroke-width="1.5" stroke-dasharray="6 3"/>
      <text x="300" y="225" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">ENCRYPTED</text>
    

  <!-- Tactical Vignette & Frame Bevel -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#F2994A" stroke-width="2" opacity="0.6"/>
  <rect x="6" y="6" width="588" height="388" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- HUD Top Banner -->
  <path d="M 10,10 L 220,10 L 240,36 L 10,36 Z" fill="#090d16" stroke="#F2994A" stroke-width="1.5"/>
  <text x="20" y="26" fill="#F2994A" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">
    STAGE ENCOUNTER // STAGE 2
  </text>

  <!-- Stage Name Ribbon -->
  <text x="20" y="62" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">
