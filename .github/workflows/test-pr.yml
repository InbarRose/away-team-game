name: PR Test Suites & Schema Validation

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-suites:
    name: "Run Manifest Generator & All 18 Test Suites"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Regenerate & Validate Component Manifests
        run: node manifests/generate_manifests.js

      - name: Run Component Linter
        run: npm run lint:components

      - name: "Run Automated Test Suites (All 18 Suites: Rules, VTT, Client & Chaos)"
        run: npm test

      - name: Build Static Production Site
        run: npm run build
